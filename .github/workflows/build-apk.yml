name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install SQLite for tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SPLIT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SPLIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPLIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPLIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk SplitOffline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SplitOffline-apk
          path: SplitOffline.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Split (offline) build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SplitOffline.apk
          body: |
            Offline Splitwise clone for Android. Download **SplitOffline.apk** on your phone and open it to install
            (allow "Install unknown apps" for your browser when prompted).
